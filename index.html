<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Xavier Keyz</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&display=swap");
  </style>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.9.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.1/dist/js.cookie.min.js"></script>
  <script src="https://unpkg.com/libphonenumber-js@1.9.50/bundle/libphonenumber-min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.16/js/intlTelInput-jquery.min.js" integrity="sha512-+xuLsxQN3JBrnBSAr/vOlUqZfQ0OwpqZfdbuiQVpzjd5Y85F8F2AyzP4YNVDrpR29EolzELxc62br5gWK51phQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.16/css/intlTelInput.css" integrity="sha512-gxWow8Mo6q6pLa1XH/CcH8JyiSDEtiwJV78E+D+QP0EVasFs8wKXq16G8CLD4CJ2SnonHr4Lm/yY2fSI2+cbmw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdn.superphone.io/widgets/widget.css" />
  <script src="https://cdn.superphone.io/widgets/widget.min.js"></script>

  <script type="text/javascript">
    window.sp = {
      widgetHash: 'nG2BeG',
      type: 'page',
    }

    // function formError(xhr, textStatus) {
    //   // Custom code Form error
    // }
    // function formSuccess(result) {
    //   // Custom code Form success
    // }
  </script>

  <style>
    body {
      margin: 0;
      background: #000;
    }

    html,
    body {
      height: 100%;
      width: 100%;
    }

    /* Full photo (zoomed out, nothing cropped) with a dark dim on top,
       sitting over a blurred copy of itself that fills any leftover space */
    #superphone-widget-page {
      box-sizing: border-box;
      background-color: #000 !important;
      background-image:
        linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
        url(background.jpg),
        linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
        url(background-blur.jpg) !important;
      background-size: cover, contain, cover, cover !important;
      background-position: center, center, center, center !important;
      background-repeat: no-repeat !important;
    }

    /* Phones / portrait: wide photo across the top fading into black, form below it */
    @media (max-aspect-ratio: 1/1) {
      #superphone-widget-page {
        background-image:
          linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.45) 30vh, #000 50vh),
          url(background.jpg) !important;
        background-size: cover, auto 52vh !important;
        background-position: center, 64% top !important;
        padding-top: 34vh;
      }
    }

    .form-error {
      color: #ffffff !important;
      font-family: 'Oswald', sans-serif !important;
      font-weight: 300 !important;
      font-size: 14px !important;
      margin-top: 15px !important;
      padding: 10px 15px !important;
      display: none; /* keep hidden by default, controlled by JS */
    }
  </style>
</head>
<body>
  <div id="superphone-widget-page" style="font-family:Oswald;">
    <div id="superphone-widget-wrapper">
      <div id="superphone-widget-landing-wrapper" class="superphone-widget widget-landing" style="background-color: transparent;">
        <div id="superphone-widget-title" style="color: rgba(255,255,255,1); font-weight: 300; font-size: 36px; text-align: center; font-family: 'Oswald', sans-serif;">
          XAVIER KEYZ
        </div>
        <div id="superphone-widget-description" style="color: rgba(255,255,255,1); font-weight: 300; font-size: 21px; margin-bottom: 20px;">
          PLEASE ENTER YOUR PHONE NUMBER BELOW<br>AND I WILL SHOOT YOU A TEXT RIGHT BACK:
        </div>
        <form id="addContact" action="#" method="POST" autocomplete="false">
          <div id="superphone-input-wrapper">
            <div class="phone-input-wrapper">
              <input
                  style="color:rgba(255,255,255,1);background-color:rgba(255,255,255,0)"
                  autocomplete="off"
                  tabindex="4"
                  type="tel"
                  class="superphone-form-control"
                  id="phone"
                  name="mobile"
                  placeholder="Mobile # (w/ country code)"
              >
            </div>
            <div class="superphone-send-button">
              <button style="font-family: Oswald" type="submit" id="submitButton">
                SUBMIT
              </button>
            </div>
          </div>
          <div id="form-error-message" class="form-error">
            <div>Something went wrong. Please check your mobile and try again.</div>
          </div>
          <div id="form-error-mobile" class="form-error">
            Phone number is not valid. Please try again.
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    window.onload = function () {
      document.getElementById('phone').focus();
    };
  </script>
</body>
</html>
